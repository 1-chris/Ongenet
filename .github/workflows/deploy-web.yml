name: Deploy web demo to GitHub Pages

# Builds the WebAssembly head (Ongenet.Web) and publishes it to GitHub Pages so the full app runs at
# onge.net/app/. The documentation site is built with DocFX (./scripts/build-site.sh): guides, dev
# tutorials, API reference, and the marketing homepage at the site root.
#
# IMPORTANT: this requires the repo's Pages source to be set to "GitHub Actions" (Settings -> Pages).
# The older "Deploy from a branch -> /docs" mode does NOT build the WASM app (GitHub never runs dotnet for
# branch-based Pages); it would only serve files you committed. This workflow replaces that mode and builds
# everything, sourcing the homepage from ./site/homepage and tutorials from DocFX.
#
# The app uses <base href="./"> and a ScriptProcessorNode for audio, so it needs NO cross-origin isolation
# (no COOP/COEP headers, which Pages can't set) and works from the /app/ sub-path as-is.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow this workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight deployment at a time; don't cancel a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install WebAssembly tools
        run: dotnet workload install wasm-tools

      - name: Assemble Pages site (DocFX docs + homepage + app at /app/)
        run: |
          set -e
          chmod +x scripts/build-site.sh
          BUILD_WASM=1 ./scripts/build-site.sh
          test -d _site/app/_framework
          test -f _site/.nojekyll
          test -f _site/docfx/docfx.min.css
          test -f _site/docfx/docfx.min.js
          test -f _site/api/index.html
          head -1 _site/api/index.html | grep -q '<!DOCTYPE html>'
          test -f _site/legal/privacy.html
          test -f _site/legal/eula.html
          head -1 _site/legal/privacy.html | grep -q '<!DOCTYPE html>'
          echo "Assembled site:"; find _site -maxdepth 2 -mindepth 1 | sort | head -30

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
